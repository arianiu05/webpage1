
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>看我本人照片</title>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            min-height: 100vh; 
            overflow: hidden; 
            font-family: sans-serif;
        }
        /* 星空背景容器 */
        #particles-js {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(circle at center, #2c3e50, #000);
        }
        /* 引导页 */
        .guide {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; color: #fff;
        }
        .guide h1 {
            font-size: 3.5rem; margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(100, 181, 246, 0.8);
        }
        .start-btn {
            padding: 15px 40px; font-size: 1.2rem;
            background: linear-gradient(45deg, #3498db, #9b59b6);
            border: none; border-radius: 50px; color: #fff; cursor: pointer;
            box-shadow: 0 10px 30px rgba(52, 152, 219, 0.3);
        }
        /* 倒计时页 */
        .countdown-page {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; color: #fff; display: none;
        }
        .countdown-page h2 { font-size: 2.5rem; margin-bottom: 20px; }
        .count { font-size: 7rem; color: #3498db; text-shadow: 0 0 30px rgba(52, 152, 219, 0.7); }
        /* 照片展示页（适配竖长照片） */
        .photos {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center; display: none;
            padding: 20px; /* 上下留边，避免裁头 */
        }
        .photo-container {
            position: relative; 
            width: 80%; 
            height: 90%; /* 把容器高度拉长，适配竖长照片 */
            max-width: 900px;
        }
        /* 你的两张照片 - 斜着叠放（适配竖长） */
        .photo1, .photo2 {
            position: absolute; 
            width: 50%; /* 把照片宽度收窄，让高度显示完整 */
            height: 100%; /* 照片高度占满容器 */
            border-radius: 20px; overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transition: all 0.3s ease; cursor: pointer;
        }
        .photo1 {
            top: 0; left: 10%; transform: rotate(-5deg); z-index: 1;
        }
        .photo2 {
            bottom: 0; right: 10%; transform: rotate(7deg); z-index: 2;
        }
        /* 悬停效果 */
        .photo1:hover, .photo2:hover {
            transform: rotate(0deg) scale(1.05); z-index: 10;
            box-shadow: 0 30px 60px rgba(100, 181, 246, 0.3);
        }
        /* 强制照片显示（适配竖长） */
        .photo1 img, .photo2 img {
            width: 100%; 
            height: 100%; 
            object-fit: contain; /* 保证竖长照片完整显示，不裁头 */
            background: rgba(0,0,0,0.3); /* 照片周围补黑底，避免空白 */
            filter: brightness(0.95);
        }
        /* 照片信息（悬停显示） */
        .photo-info {
            position: absolute; bottom: 0; left: 0; width: 100%;
            padding: 25px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            color: #fff; opacity: 0; transition: opacity 0.3s ease;
        }
        .photo1:hover .photo-info, .photo2:hover .photo-info { opacity: 1; }
        .photo-info h3 { font-size: 1.8rem; margin-bottom: 10px; }
        .photo-info p { font-size: 1rem; opacity: 0.8; }
    </style>
</head>
<body>
    <!-- 星空背景 -->
    <div id="particles-js"></div>

    <!-- 1. 引导页 -->
    <div class="guide" id="guide">
        <h1>准备好看我的照片了吗？</h1>
        <button class="start-btn" id="startBtn">点击开始 →</button>
    </div>

    <!-- 2. 倒计时页（到1停） -->
    <div class="countdown-page" id="countdownPage">
        <h2>高能预警❗</h2>
        <div class="count" id="count">3</div>
    </div>

    <!-- 3. 你的竖长照片（完整显示） -->
    <div class="photos" id="photosPage">
        <div class="photo-container">
            <!-- 你的第一张照片 IMG_5470.JPG -->
            <div class="photo1">
                <img src="IMG_5470.JPG" alt="我的照片1">
                <div class="photo-info">
                    <p>笑晕了</p>
                </div>
            </div>
            <!-- 你的第二张照片 IMG_5827.PNG -->
            <div class="photo2">
                <img src="IMG_5827.PNG" alt="我的照片2">
                <div class="photo-info">
                    <p>芜湖</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 初始化星空背景
        particlesJS("particles-js", {
            particles: {
                number: { value: 80, density: { enable: true, value_area: 800 } },
                color: { value: "#ffffff" },
                shape: { type: "circle" },
                opacity: { value: 0.5, random: true },
                size: { value: 3, random: true },
                line_linked: {
                    enable: true,
                    distance: 150,
                    color: "#ffffff",
                    opacity: 0.2,
                    width: 1
                },
                move: {
                    enable: true,
                    speed: 1,
                    direction: "none",
                    random: true,
                    straight: false,
                    out_mode: "out",
                    bounce: false
                }
            },
            interactivity: {
                detect_on: "canvas",
                events: {
                    onhover: { enable: true, mode: "grab" },
                    onclick: { enable: true, mode: "push" },
                    resize: true
                },
                modes: {
                    grab: { distance: 140, line_linked: { opacity: 0.5 } },
                    push: { particles_nb: 3 }
                }
            },
            retina_detect: true
        });

        // 页面逻辑
        const guide = document.getElementById('guide');
        const countdownPage = document.getElementById('countdownPage');
        const photosPage = document.getElementById('photosPage');
        const startBtn = document.getElementById('startBtn');
        const countEl = document.getElementById('count');

        startBtn.addEventListener('click', () => {
            guide.style.display = 'none';
            countdownPage.style.display = 'block';
            
            let count = 3;
            countEl.textContent = count;
            const timer = setInterval(() => {
                count--;
                if (count >= 1) {
                    countEl.textContent = count;
                } else {
                    clearInterval(timer);
                    countdownPage.style.display = 'none';
                    photosPage.style.display = 'flex';
                }
            }, 1000);
        });
    </script>
</body>
</html>
